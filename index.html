<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive map of my travel adventures around the world.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="My Travel Adventures">
    <meta property="og:description" content="An interactive map of my travel adventures — photo markers, a timeline, and the route through every stop.">
    <meta property="og:image" content="https://fanyiyang.github.io/travel-map/screenshot.png">
    <meta property="og:url" content="https://fanyiyang.github.io/travel-map/">
    <meta name="twitter:card" content="summary_large_image">
    <title>My Travel Adventures</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --accent: #2f86d1;
            --accent-deep: #14406e;
            --bg: #eef2f6;
            --card: #ffffff;
            --ink: #1f2d3a;
            --muted: #5f7080;
            --faint: #8fa1b0;
            --line: #dbe4ec;
            --shadow-sm: 0 1px 2px rgba(15,40,70,.08), 0 4px 14px rgba(15,40,70,.06);
            --shadow-lg: 0 6px 16px rgba(15,40,70,.16), 0 18px 44px rgba(15,40,70,.14);
        }
        ::selection { background: rgba(47,134,209,.25); }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }
        header {
            background:
                radial-gradient(120% 160% at 15% -20%, rgba(120,190,255,.28) 0%, rgba(120,190,255,0) 55%),
                linear-gradient(140deg, #0d2c50 0%, #17548f 55%, #2f86d1 100%);
            color: white;
            text-align: center;
            padding: 2.9rem 1rem 5.2rem;
        }
        h1 {
            margin: 0;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-weight: 700;
            font-size: clamp(2rem, 5.5vw, 3rem);
            letter-spacing: 0.5px;
        }
        .subtitle {
            margin: 0.8rem 0 0;
            opacity: 0.88;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
        }
        .subtitle::before { content: '✈'; margin-right: 0.9em; letter-spacing: 0; }
        .subtitle::after { content: '·'; margin-left: 0.9em; letter-spacing: 0; }
        #map {
            height: 65vh;
            min-height: 400px;
            width: 100%;
            margin-top: -3.4rem;
            margin-bottom: 0.5rem;
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            border: 4px solid rgba(255,255,255,0.85);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 2.5rem;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1.4rem 0 1.6rem;
        }
        .chip {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--muted);
            border-radius: 999px;
            padding: 0.42rem 1.1rem;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
        }
        .chip.active {
            background: linear-gradient(135deg, #2f86d1, #1b5f9e);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 12px rgba(47,134,209,.35);
        }
        .place-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.6rem;
        }
        .place-card {
            background-color: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--line);
            transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
            cursor: pointer;
            position: relative;
        }
        .place-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }
        .place-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(47,134,209,.3), var(--shadow-lg);
        }
        .place-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background-color: var(--line);
            transition: transform 0.5s ease;
            cursor: pointer;
        }
        .place-card:hover .place-image {
            transform: scale(1.06);
        }
        .photo-badge {
            position: absolute;
            top: 0.65rem;
            right: 0.65rem;
            background: rgba(10,28,46,0.6);
            backdrop-filter: blur(4px);
            color: white;
            font-size: 0.72rem;
            border-radius: 999px;
            padding: 0.18rem 0.6rem;
        }
        .place-info {
            padding: 1rem 1.1rem 1.15rem;
        }
        .place-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin: 0 0 0.4rem 0;
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--ink);
        }
        .year-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
            background: rgba(47,134,209,.12);
            border-radius: 999px;
            padding: 0.16rem 0.6rem;
            flex-shrink: 0;
        }
        .place-description {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
        }
        .mapboxgl-popup {
            max-width: 250px;
        }
        .mapboxgl-popup-content {
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            padding: 12px;
        }
        .popup-image {
            width: 100%;
            height: 135px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background-color: var(--line);
            cursor: zoom-in;
        }
        .popup-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.4rem;
        }
        .popup-nav button {
            border: none;
            background: rgba(47,134,209,.12);
            color: var(--accent);
            border-radius: 8px;
            width: 2rem;
            height: 1.6rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .popup-nav button:hover {
            background: rgba(47,134,209,.24);
        }
        .popup-counter {
            font-size: 0.78rem;
            color: var(--faint);
        }
        .popup-title {
            margin: 0.55rem 0 0.25rem;
            font-size: 1rem;
            color: var(--ink);
        }
        .popup-description {
            margin: 0;
            color: var(--muted);
            font-size: 0.85rem;
        }
        footer {
            text-align: center;
            padding: 2rem 1rem 2.5rem;
            color: var(--faint);
            font-size: 0.9rem;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }

        /* --- Lightbox (fullscreen photo viewer) --- */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(4,10,17,0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #lightbox[hidden], #journalOverlay[hidden] { display: none; }
        #lbImg {
            max-width: 94vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }
        .lb-caption {
            color: #cfd8e0;
            margin-top: 0.9rem;
            font-size: 0.95rem;
            display: flex;
            gap: 1rem;
            padding: 0 1rem;
            text-align: center;
            letter-spacing: 0.03em;
        }
        .lb-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.14);
            color: white;
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 1.6rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .lb-btn:hover { background: rgba(255,255,255,0.3); }
        #lbPrev { left: 3vw; }
        #lbNext { right: 3vw; }
        .lb-close {
            position: absolute;
            top: 10px;
            right: 16px;
            background: none;
            border: none;
            color: white;
            font-size: 2.4rem;
            cursor: pointer;
            line-height: 1;
        }

        /* --- Journal overlay --- */
        .popup-journal {
            display: inline-block;
            margin-top: 0.45rem;
            color: var(--accent);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
        }
        #journalOverlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(4,10,17,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .journal-card {
            background: var(--card);
            color: var(--ink);
            max-width: 640px;
            width: 100%;
            max-height: 84vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 1.6rem 1.85rem;
            position: relative;
            box-shadow: var(--shadow-lg);
        }
        .journal-card h2 {
            margin: 0 0 0.2rem;
            color: var(--accent-deep);
            padding-right: 1.5rem;
            font-family: 'Playfair Display', Georgia, serif;
        }
        .journal-date { color: var(--faint); font-size: 0.85rem; margin-bottom: 1rem; }
        .journal-card p { line-height: 1.7; margin: 0 0 0.9rem; }
        .journal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.7rem;
            cursor: pointer;
            color: var(--faint);
        }

        /* --- Small screens --- */
        @media (max-width: 520px) {
            header { padding-bottom: 4.2rem; }
            #map { height: 55vh; min-height: 320px; margin-top: -2.6rem; }
            .mapboxgl-popup { max-width: 210px; }
            .container { padding: 0 0.75rem 1.5rem; }
        }

        /* --- Dark mode --- */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e141b;
                --card: #18212b;
                --ink: #e4ecf3;
                --muted: #a9b9c7;
                --faint: #7c8fa0;
                --line: #263341;
                --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
                --shadow-lg: 0 6px 16px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.45);
            }
            header {
                background:
                    radial-gradient(120% 160% at 15% -20%, rgba(80,150,220,.2) 0%, rgba(80,150,220,0) 55%),
                    linear-gradient(140deg, #081b30 0%, #123c66 55%, #1d5c92 100%);
            }
            #map { border-color: rgba(24,33,43,0.9); }
            .journal-card h2 { color: #7fb6e0; }
            .mapboxgl-popup-content { background: var(--card); color: var(--ink); }
            .mapboxgl-popup-tip {
                border-top-color: var(--card) !important;
                border-bottom-color: var(--card) !important;
            }
            .mapboxgl-popup-anchor-left .mapboxgl-popup-tip { border-right-color: var(--card) !important; }
            .mapboxgl-popup-anchor-right .mapboxgl-popup-tip { border-left-color: var(--card) !important; }
            .mapboxgl-popup-close-button { color: var(--ink); }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Travel Adventures</h1>
        <p class="subtitle" id="subtitle">Places I've been, mapped.</p>
    </header>
    <div class="container">
        <div id="map"></div>
        <div class="filter-bar" id="filterBar"></div>
        <div class="place-grid" id="placeGrid"></div>
    </div>
    <footer>Click a marker or a card to explore each destination. · <a href="journal.html">Journal</a> · <a href="add.html">Add a destination</a> · <a href="manage.html">Manage</a></footer>

    <div id="lightbox" hidden>
        <button class="lb-close" aria-label="Close">×</button>
        <button class="lb-btn" id="lbPrev" aria-label="Previous photo">‹</button>
        <img id="lbImg" alt="">
        <button class="lb-btn" id="lbNext" aria-label="Next photo">›</button>
        <div class="lb-caption"><span id="lbTitle"></span><span id="lbCounter"></span></div>
    </div>
    <div id="journalOverlay" hidden>
        <div class="journal-card">
            <button class="journal-close" aria-label="Close">×</button>
            <h2 id="jTitle"></h2>
            <div class="journal-date" id="jDate"></div>
            <div id="jBody"></div>
        </div>
    </div>

    <script src="places.js"></script>
    <script>
        // Destinations live in places.js; add new ones with add.html.
        // Accept both the current schema ({images: [...]}) and the old one ({image: "..."}).
        const normalized = (window.PLACES || []).map(p => ({
            ...p,
            images: p.images || (p.image ? [p.image] : [])
        }));

        // Timeline order: dated entries sort by date; undated entries inherit the
        // last seen date so they keep their position in the hand-ordered list.
        let carry = '';
        const places = normalized
            .map((p, i) => { if (p.date) carry = p.date; return { p, key: carry, i }; })
            .sort((a, b) => (a.key < b.key ? -1 : a.key > b.key ? 1 : a.i - b.i))
            .map(k => k.p);

        if (!places.length) {
            document.getElementById('map').textContent = 'No destinations found — places.js failed to load.';
        }

        // Stats bar: destinations · countries · since first dated trip
        const countryCount = new Set(places.map(p => p.country).filter(Boolean)).size;
        const firstYear = places.filter(p => p.date).map(p => p.date.slice(0, 4)).sort()[0];
        document.getElementById('subtitle').textContent = [
            `${places.length} destinations`,
            countryCount ? `${countryCount} countries` : '',
            firstYear ? `since ${firstYear}` : ''
        ].filter(Boolean).join(' · ');

        // --- Photo cards (render before any map work so they never depend on Mapbox) ---
        const placeGrid = document.getElementById('placeGrid');
        const cards = places.map(place => {
            const card = document.createElement('div');
            card.className = 'place-card';
            const year = place.date ? `<span class="year-badge">${place.date.slice(0, 4)}</span>` : '';
            const badge = place.images.length > 1 ? `<span class="photo-badge">${place.images.length} photos</span>` : '';
            card.innerHTML = `
                <img src="${place.images[0] || ''}" alt="${place.name}" class="place-image" loading="lazy">
                ${badge}
                <div class="place-info">
                    <h2 class="place-name">${place.name}${year}</h2>
                    <p class="place-description">${place.description}</p>
                </div>
            `;
            placeGrid.appendChild(card);
            return card;
        });

        // --- Map ---
        let map = null;
        let selectedYear = 'all';
        if (typeof mapboxgl === 'undefined') {
            document.getElementById('map').textContent = 'Map could not be loaded. Check your network connection.';
        } else {
            mapboxgl.accessToken = 'pk.eyJ1IjoiZmFueWl5YW5nMjMzIiwiYSI6ImNseG56dHp1dTA5cmQyanB4MDlyNXB5YjAifQ.dXU4lx12g2LDUhENBR_UGA';
            map = new mapboxgl.Map({
                container: 'map',
                // navigation-night keeps color (blue ocean, tinted roads) in dark
                // mode — dark-v11 reads as near-monochrome
                style: window.matchMedia('(prefers-color-scheme: dark)').matches
                    ? 'mapbox://styles/mapbox/navigation-night-v1'
                    : 'mapbox://styles/mapbox/streets-v11',
                center: [0, 25],
                zoom: 1.5,
                // one-finger drag scrolls the page on touch devices; two fingers move the map
                cooperativeGestures: true
            });
            window._map = map;
            map.addControl(new mapboxgl.NavigationControl(), 'top-right');
            map.addControl(new mapboxgl.FullscreenControl(), 'top-right');

            // Popup content with a photo carousel, built on first open so the
            // images aren't all fetched up front.
            function popupContent(placeIndex) {
                const place = places[placeIndex];
                const wrap = document.createElement('div');
                const img = document.createElement('img');
                img.className = 'popup-image';
                img.alt = place.name;
                wrap.appendChild(img);

                let idx = 0;
                const show = i => {
                    idx = (i + place.images.length) % place.images.length;
                    img.src = place.images[idx];
                    if (counter) counter.textContent = `${idx + 1} / ${place.images.length}`;
                };
                let counter = null;
                if (place.images.length > 1) {
                    const nav = document.createElement('div');
                    nav.className = 'popup-nav';
                    const prev = document.createElement('button');
                    prev.textContent = '‹';
                    prev.addEventListener('click', () => show(idx - 1));
                    const next = document.createElement('button');
                    next.textContent = '›';
                    next.addEventListener('click', () => show(idx + 1));
                    counter = document.createElement('span');
                    counter.className = 'popup-counter';
                    nav.append(prev, counter, next);
                    wrap.appendChild(nav);
                }
                show(0);
                img.addEventListener('click', () => openLightbox(placeIndex, idx));

                const title = document.createElement('h3');
                title.className = 'popup-title';
                title.textContent = place.name + (place.date ? ` · ${place.date.slice(0, 4)}` : '');
                const desc = document.createElement('p');
                desc.className = 'popup-description';
                desc.textContent = place.description;
                wrap.append(title, desc);

                if (place.journal) {
                    const link = document.createElement('a');
                    link.className = 'popup-journal';
                    link.textContent = 'Read the journal →';
                    link.addEventListener('click', () => openJournal(placeIndex));
                    wrap.appendChild(link);
                }
                return wrap;
            }

            // One popup at a time; content is built lazily and cached per place.
            const popupCache = {};
            let activePopup = null;
            window.openPopup = index => {
                if (!map) return;
                if (!popupCache[index]) popupCache[index] = popupContent(index);
                if (activePopup) activePopup.remove();
                activePopup = new mapboxgl.Popup({ offset: 30 })
                    .setLngLat(places[index].coordinates)
                    .setDOMContent(popupCache[index])
                    .addTo(map);
            };

            // Photo markers are rendered as a WebGL symbol layer instead of DOM
            // markers: DOM markers are repositioned a frame behind the map and
            // visibly lag while panning; symbols draw in the same frame.
            async function markerIcon(url) {
                const img = new Image();
                img.src = url;
                await img.decode();
                const S = 96, B = 6; // canvas px (drawn at 2x pixel ratio → 48 CSS px), border width
                const c = document.createElement('canvas');
                c.width = c.height = S;
                const ctx = c.getContext('2d');
                ctx.beginPath();
                ctx.arc(S / 2, S / 2, S / 2 - 1, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.save();
                ctx.beginPath();
                ctx.arc(S / 2, S / 2, S / 2 - B, 0, Math.PI * 2);
                ctx.clip();
                const side = Math.min(img.naturalWidth, img.naturalHeight);
                ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
                ctx.restore();
                return ctx.getImageData(0, 0, S, S);
            }

            map.on('load', async () => {
                let segments = [];
                if (typeof turf !== 'undefined') { // skip the route line if Turf failed to load
                    // Great-circle arcs between consecutive stops; MultiLineString keeps
                    // antimeridian-crossing segments (e.g. across the Pacific) intact.
                    for (let i = 0; i < places.length - 1; i++) {
                        const arc = turf.greatCircle(
                            turf.point(places[i].coordinates),
                            turf.point(places[i + 1].coordinates),
                            { npoints: 100 }
                        );
                        if (arc.geometry.type === 'LineString') {
                            segments.push(arc.geometry.coordinates);
                        } else {
                            segments.push(...arc.geometry.coordinates);
                        }
                    }
                    map.addSource('route', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            properties: {},
                            geometry: { type: 'MultiLineString', coordinates: segments }
                        }
                    });
                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: {
                            'line-color': '#3498db',
                            'line-width': 2.5,
                            'line-dasharray': [2, 3]
                        }
                    });
                }

                await Promise.all(places.map(async (place, i) => {
                    try {
                        map.addImage(`photo-${i}`, await markerIcon(place.images[0]), { pixelRatio: 2 });
                    } catch (e) { /* image failed to decode — this stop just gets no marker */ }
                }));
                // Nearby stops (e.g. Tokyo/Kamakura) merge into a numbered cluster
                // at low zoom and separate as you zoom in.
                map.addSource('places', {
                    type: 'geojson',
                    cluster: true,
                    clusterRadius: 44,
                    clusterMaxZoom: 11,
                    data: placeFeatures(selectedYear)
                });
                map.addLayer({
                    id: 'clusters',
                    type: 'circle',
                    source: 'places',
                    filter: ['has', 'point_count'],
                    paint: {
                        'circle-color': '#3498db',
                        'circle-radius': 22,
                        'circle-stroke-width': 3,
                        'circle-stroke-color': '#fff'
                    }
                });
                map.addLayer({
                    id: 'cluster-count',
                    type: 'symbol',
                    source: 'places',
                    filter: ['has', 'point_count'],
                    layout: {
                        'text-field': ['get', 'point_count_abbreviated'],
                        'text-font': ['DIN Pro Bold', 'Arial Unicode MS Bold'],
                        'text-size': 15,
                        'text-allow-overlap': true
                    },
                    paint: { 'text-color': '#ffffff' }
                });
                map.addLayer({
                    id: 'places',
                    type: 'symbol',
                    source: 'places',
                    filter: ['!', ['has', 'point_count']],
                    layout: { 'icon-image': ['get', 'icon'], 'icon-allow-overlap': true }
                });
                map.on('click', 'places', e => window.openPopup(e.features[0].properties.index));
                map.on('click', 'clusters', e => {
                    const f = e.features[0];
                    map.getSource('places').getClusterExpansionZoom(f.properties.cluster_id, (err, zoom) => {
                        if (!err) map.easeTo({ center: f.geometry.coordinates, zoom: zoom + 0.5, duration: 1200 });
                    });
                });
                ['places', 'clusters'].forEach(layer => {
                    map.on('mouseenter', layer, () => { map.getCanvas().style.cursor = 'pointer'; });
                    map.on('mouseleave', layer, () => { map.getCanvas().style.cursor = ''; });
                });
                applyYearFilter(selectedYear);

                if (segments.length) animatePlane(segments.flat());
            });

            // A little plane flies the whole route once when the page opens.
            function planeIcon() {
                const S = 64;
                const c = document.createElement('canvas');
                c.width = c.height = S;
                const ctx = c.getContext('2d');
                ctx.translate(S / 2, S / 2);
                // Top-down airplane silhouette pointing north: nose, fuselage,
                // swept main wings, tail wings. Right half; the left is mirrored.
                const half = [
                    [3.2, -20], [3.2, -8],           // nose flank, fuselage to wing root
                    [26, 4], [26, 9.5], [3.4, 5.5],  // main wing: tip leading, tip trailing, root trailing
                    [3.4, 15],                       // fuselage to tail root
                    [11.5, 22.5], [11.5, 26.5],      // tail wing tip
                    [1.8, 23.5], [0, 25]             // tail trailing edge to center
                ];
                ctx.beginPath();
                ctx.moveTo(0, -26); // nose tip
                half.forEach(([x, y]) => ctx.lineTo(x, y));
                [...half].reverse().slice(1).forEach(([x, y]) => ctx.lineTo(-x, y));
                ctx.closePath();
                ctx.fillStyle = '#1e5799';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3.5;
                ctx.lineJoin = 'round';
                ctx.stroke();
                ctx.fill();
                return ctx.getImageData(0, 0, S, S);
            }
            function animatePlane(path) {
                if (path.length < 2) return;
                map.addImage('plane', planeIcon(), { pixelRatio: 2 });
                // Cumulative distance along the route so the plane flies at a
                // constant ground speed — equal points per segment would make it
                // crawl over short hops and streak across ocean crossings.
                const cum = [0];
                for (let i = 1; i < path.length; i++) {
                    cum.push(cum[i - 1] + turf.distance(turf.point(path[i - 1]), turf.point(path[i])));
                }
                const total = cum[cum.length - 1];
                const pointAt = i => ({
                    type: 'Feature',
                    properties: { bearing: turf.bearing(turf.point(path[i]), turf.point(path[Math.min(i + 1, path.length - 1)])) },
                    geometry: { type: 'Point', coordinates: path[i] }
                });
                map.addSource('plane', { type: 'geojson', data: pointAt(0) });
                map.addLayer({
                    id: 'plane',
                    type: 'symbol',
                    source: 'plane',
                    layout: {
                        'icon-image': 'plane',
                        'icon-rotate': ['get', 'bearing'],
                        'icon-rotation-alignment': 'map',
                        'icon-allow-overlap': true,
                        'icon-ignore-placement': true
                    }
                });
                const DURATION = 30000;
                let start = null;
                let idx = 0;
                const frame = ts => {
                    if (!map.getSource('plane')) return; // style changed / removed
                    if (start === null) start = ts;
                    const t = Math.min(1, (ts - start) / DURATION);
                    const target = t * total;
                    while (idx < path.length - 2 && cum[idx + 1] < target) idx++;
                    map.getSource('plane').setData(pointAt(idx));
                    if (t < 1) {
                        requestAnimationFrame(frame);
                    } else {
                        map.removeLayer('plane');
                        map.removeSource('plane');
                    }
                };
                requestAnimationFrame(frame);
            }
        }

        // --- Card interactions ---
        places.forEach((place, index) => {
            cards[index].addEventListener('click', () => {
                document.querySelectorAll('.place-card.active').forEach(c => c.classList.remove('active'));
                cards[index].classList.add('active');
                if (!map) return;
                // gentle, gradual approach — same feel as the original site
                map.flyTo({ center: place.coordinates, zoom: 9, speed: 0.8, curve: 1 });
                window.openPopup(index);
                map.getContainer().scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        });

        // --- Year filter ---
        function placeFeatures(year) {
            return {
                type: 'FeatureCollection',
                features: places
                    .map((p, i) => ({
                        type: 'Feature',
                        properties: { index: i, year: p.date ? p.date.slice(0, 4) : '', icon: `photo-${i}` },
                        geometry: { type: 'Point', coordinates: p.coordinates }
                    }))
                    .filter(f => year === 'all' || f.properties.year === year)
            };
        }
        function applyYearFilter(year) {
            selectedYear = year;
            document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.toggle('active', c.dataset.year === year));
            places.forEach((p, i) => {
                cards[i].style.display = (year === 'all' || (p.date && p.date.slice(0, 4) === year)) ? '' : 'none';
            });
            // Clustered sources ignore layer filters, so swap the data instead.
            if (map && map.getSource('places')) {
                map.getSource('places').setData(placeFeatures(year));
            }
        }
        const years = [...new Set(places.filter(p => p.date).map(p => p.date.slice(0, 4)))].sort();
        if (years.length > 1) {
            const bar = document.getElementById('filterBar');
            ['all', ...years].forEach(y => {
                const chip = document.createElement('button');
                chip.className = 'chip';
                chip.dataset.year = y;
                chip.textContent = y === 'all' ? 'All' : y;
                chip.addEventListener('click', () => applyYearFilter(y));
                bar.appendChild(chip);
            });
            applyYearFilter('all');
        }

        // --- Lightbox ---
        const lbEl = document.getElementById('lightbox');
        let lbPlace = 0, lbIdx = 0;
        function lbShow() {
            const place = places[lbPlace];
            document.getElementById('lbImg').src = place.images[lbIdx];
            document.getElementById('lbTitle').textContent = place.name;
            document.getElementById('lbCounter').textContent =
                place.images.length > 1 ? `${lbIdx + 1} / ${place.images.length}` : '';
            const nav = place.images.length > 1 ? '' : 'none';
            document.getElementById('lbPrev').style.display = nav;
            document.getElementById('lbNext').style.display = nav;
        }
        window.openLightbox = (placeIndex, imgIndex) => {
            lbPlace = placeIndex;
            lbIdx = imgIndex || 0;
            lbShow();
            lbEl.hidden = false;
        };
        function lbStep(d) {
            const n = places[lbPlace].images.length;
            lbIdx = (lbIdx + d + n) % n;
            lbShow();
        }
        document.getElementById('lbPrev').addEventListener('click', () => lbStep(-1));
        document.getElementById('lbNext').addEventListener('click', () => lbStep(1));
        lbEl.querySelector('.lb-close').addEventListener('click', () => { lbEl.hidden = true; });
        lbEl.addEventListener('click', e => { if (e.target === lbEl) lbEl.hidden = true; });
        let touchX = null;
        lbEl.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
        lbEl.addEventListener('touchend', e => {
            if (touchX === null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 40) lbStep(dx < 0 ? 1 : -1);
            touchX = null;
        }, { passive: true });

        // --- Journal overlay ---
        const jEl = document.getElementById('journalOverlay');
        window.openJournal = placeIndex => {
            const p = places[placeIndex];
            document.getElementById('jTitle').textContent = p.name;
            document.getElementById('jDate').textContent = [p.date, p.country].filter(Boolean).join(' · ');
            const body = document.getElementById('jBody');
            body.innerHTML = '';
            String(p.journal || '').split(/\n+/).forEach(par => {
                const el = document.createElement('p');
                el.textContent = par;
                body.appendChild(el);
            });
            jEl.hidden = false;
        };
        jEl.addEventListener('click', e => { if (e.target === jEl) jEl.hidden = true; });
        jEl.querySelector('.journal-close').addEventListener('click', () => { jEl.hidden = true; });

        document.addEventListener('keydown', e => {
            if (!lbEl.hidden) {
                if (e.key === 'Escape') lbEl.hidden = true;
                if (e.key === 'ArrowLeft') lbStep(-1);
                if (e.key === 'ArrowRight') lbStep(1);
            } else if (!jEl.hidden && e.key === 'Escape') {
                jEl.hidden = true;
            }
        });
    </script>
</body>
</html>
